name: Update WC2026 Scores

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update WC scores
        run: python update_scores.py

      - name: Commit and push results.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet \
            && echo "No score changes -- skipping commit." \
            || (
              git commit -m "chore: update WC scores $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push
            )
